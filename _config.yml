# Jekyll configuration for the GitHub Pages site.
#
# Pages is configured to build from the main branch root (Settings > Pages,
# source: main, path: /), which runs Jekyll over the whole repository and
# renders every markdown file it finds. That published these maintainer-facing
# working notes as pages on the public site, e.g.
# https://alexdiana.github.io/occJSDM/TODO.html.
#
# Excluding them keeps them out of the generated site only. They stay tracked
# in git and readable in the repository, which is public regardless.
#
# Keep this list in sync with any new file that is written for agents or
# maintainers rather than for package users.
#
# dev/ and deprecated/ are excluded as whole directories. dev/ holds
# development guides, Superpowers planning documents, study evidence and
# teaching-build tools; deprecated/ holds superseded code. mcp/ is reserved
# for the optional MCP component and its client setup. Keeping these out of
# the generated site does not make tracked files private. New maintainer
# documents in these directories are covered without individual exclusions.
#
# CLAUDE-HANDOVER.md and vignettes/LESSON-PLAN.md are also maintainer-facing
# documents, so they are excluded by name. Links to any excluded file from a
# published page would be a 404 on the site, so such links must point at the
# file on GitHub instead.
#
# During the beta the eight teaching lessons are withheld until Doug has
# reviewed them: their pages, figure folders and the teaching data are
# excluded below, assets/js/lessons.js marks them unpublished (a Node test in
# dev/simstudy/lesson-site/ checks that the two agree), and .Rbuildignore keeps
# them out of the package (vignettes/.install_extras no longer copies their
# teaching data). TODO.md lists the steps to publish a lesson.
exclude:
  - TODO.md
  - AGENTS.md
  - CLAUDE.md
  - CLAUDE-HANDOVER.md
  - vignettes/LESSON-PLAN.md
  - dev/
  - mcp/
  - deprecated/
  - vignettes/occJSDM-lesson-0.md
  - vignettes/occJSDM-lesson-1.md
  - vignettes/occJSDM-lesson-2.md
  - vignettes/occJSDM-lesson-3.md
  - vignettes/occJSDM-lesson-4.md
  - vignettes/occJSDM-lesson-5.md
  - vignettes/occJSDM-lesson-6.md
  - vignettes/occJSDM-lesson-7.md
  - vignettes/occJSDM-lesson-0_files/
  - vignettes/occJSDM-lesson-1_files/
  - vignettes/occJSDM-lesson-2_files/
  - vignettes/occJSDM-lesson-3_files/
  - vignettes/occJSDM-lesson-4_files/
  - vignettes/teaching-data/
