<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="680" height="392" viewBox="0 0 680 392" role="img" font-family="Helvetica, Arial, sans-serif">
<title>PCA axis versus blend axis on the same sites</title>
<desc>Two panels show the same sites plotted on two embedding columns. Sites vary a lot along column 1 and a little along column 2, and the species is present mainly where column 2 is high. The PCA axis runs along column 1 and mixes presences with absences. The blend axis runs along column 2 and separates them.</desc>
